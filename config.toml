# WAF-Rejected Default Configuration
# High-Performance Enterprise Web Application Firewall

# Server configuration
bind_addr = "0.0.0.0:8080"
health_bind_addr = "0.0.0.0:8081"
upstream_uri = "http://127.0.0.1:3000"

[proxy]
upstream_url = "http://127.0.0.1:3000"
bind_addr = "0.0.0.0:8080"
timeout_seconds = 30
max_request_size = 10485760

[server]
max_connections = 1000
# Only trust X-Forwarded-For from these CIDRs. Empty means never trust it.
trusted_proxies = []
request_timeout_secs = 30
keep_alive_timeout_secs = 90
enable_http2 = true
enable_http3 = false
supported_http_versions = ["1.0", "1.1", "2"]
max_body_size = 10485760

[server.tls]
enabled = false  # Set to true in production or terminate TLS at the load balancer
cert_path = "/etc/waf-rejected/certs/server.crt"
key_path = "/etc/waf-rejected/certs/server.key"
min_version = "1.2"
max_version = "1.3"
alpn_protocols = ["h2", "http/1.1"]
require_client_cert = false

[logging]
level = "info"
json_format = false

[waf]
enabled = true
fail_mode = "closed"
upstream_timeout_ms = 30000

[waf.rate_limit]
per_ip_enabled = true
per_ip_max_requests = 100
per_ip_window_secs = 60
global_enabled = true
global_max_requests = 10000
global_window_secs = 60

[waf.security_events]
enabled = true
format = "json"
min_threat_level = "medium"
enable_cef = true
cef_output_file = "./logs/security_events.cef"
cef_device_vendor = "WAF-Rejected"
cef_device_product = "Security WAF"
cef_device_version = "1.0.0"
enable_otel = false
enable_sled = true
sled_db_path = "./data/waf_security_events.sled"
sled_max_events = 100000
sled_compress = false

[waf.content_inspection]
enabled = true
inspect_headers = true
inspect_body = true
max_body_size = 10485760
threat_patterns = ["sql_injection", "xss", "command_injection", "path_traversal"]

[waf.geo_blocking]
enabled = false
# database_path = "/etc/waf/GeoLite2-City.mmdb"
blocked_countries = []
blocked_regions = []
block_tor = false
block_vpn = false
block_datacenter = false

[waf.admission]
# Bound concurrent heavy (CRS body) inspections so a few large bodies cannot
# starve cheap requests. Cheap requests (no body, or a gRPC/GraphQL body
# withheld from CRS) bypass this queue. Saturation or timeout fails closed with
# 503 + Retry-After; inspection is never skipped or reduced.
enabled = true
# 0 = auto: about half the reactor pool, capped at pool_size - 1 (at least
# 1), reserving reactor workers for cheap traffic. Set explicitly to tune.
heavy_permits = 0
# Maximum time a heavy request may wait for a permit before a 503.
queue_timeout_ms = 250
# Maximum heavy requests waiting; 0 rejects immediately when saturated.
max_queued = 64

[waf.wasm]
# The component ABI is not wired up yet; enabling this uses the built-in
# heuristic fallback, not the actual Coraza module.
enabled = false
module_path = "rules/coraza.wasm"
memory_limit = 16777216  # 16 MiB
timeout_ms = 100
debug = false
instance_pool_size = 10
hot_reload = true
rules_config = "rules/coraza.conf"

[waf.grpc]
# Protocol-aware gRPC inspection (active when waf.coraza.enabled is true).
# Protobuf bodies are validated at the frame level and never sent to CRS body
# rules. See docs/grpc-inspection.md.
enabled = true
# Empty = monitor only. Entries are fully-qualified gRPC methods and can be
# generated from a protobuf FileDescriptorSet.
method_allowlist = []
# Generated allowlist artifact (JSON). When set, its methods are merged with
# method_allowlist, per-method max_message_bytes values win over the global
# limit, and its unknown_method_action applies unless set here explicitly.
# A configured file that cannot be loaded aborts start-up.
# allowlist_file = "/etc/waf/grpc/allowlist.json"
max_message_bytes = 4194304  # 4 MiB
max_frames = 64
# "allow" or "block"; unset defaults to block for a non-empty allowlist.
# unknown_method_action = "block"

[waf.graphql]
# Protocol-aware GraphQL-over-HTTP inspection. The default `crs` mode keeps the
# full CRS JSON body scan (no security change). `graphql-only` runs the GraphQL
# checks and withholds the raw body from CRS body rules (header/URI rules still
# run); it requires a non-empty allowlist and gives up CRS body-rule coverage
# for these requests. `off` disables GraphQL-specific checks; CRS still scans.
# See docs/graphql-inspection.md.
enabled = true
body_scan = "crs"

# Operation names and/or 64-character SHA-256 query hashes that may execute.
# Empty = monitor-only (except graphql-only, which requires an entry).
operation_allowlist = []
# Persisted-query artifact: JSON list of { "name": "...", "sha256": "..." }.
# A configured file that cannot be loaded aborts start-up.
# allowlist_file = "/etc/waf/graphql/allowlist.json"
# "monitor" or "block"; unset defaults to block for a non-empty allowlist.
# unknown_operation_action = "block"

max_body_bytes = 8388608       # 8 MiB
max_query_bytes = 1048576      # 1 MiB
max_variables_bytes = 1048576  # 1 MiB
max_variables = 128
max_depth = 128
max_aliases = 1024
max_fields = 8192
allow_mutations = true
allow_subscriptions = true

[security.auth]
enabled = false
api_keys = []
header_name = "X-API-Key"
require_https = false

[security.ai]
enabled = false
threat_threshold = 0.8
timeout_ms = 5000

[security.compliance]
enabled = false

# Evidence packs, not certifications. See docs/compliance/eu-regulatory-status.md.
[security.compliance.regulatory]
gdpr = false
ai_act = false
nis2 = false
cra = false
