bind_addr = "0.0.0.0:8080"
health_bind_addr = "0.0.0.0:8081"
upstream_uri = "http://127.0.0.1:3000"

[proxy]
upstream_url = "http://127.0.0.1:3000"
bind_addr = "0.0.0.0:8080"
timeout_seconds = 30
max_request_size = 10485760

[server]
max_connections = 1000
trusted_proxies = ["10.0.0.0/8", "192.168.0.0/16"]
request_timeout_secs = 30
keep_alive_timeout_secs = 90
enable_http2 = true
enable_http3 = false
supported_http_versions = ["1.0", "1.1", "2"]
max_body_size = 10485760

[server.tls]
enabled = false
cert_path = "/etc/waf-rejected/certs/server.crt"
key_path = "/etc/waf-rejected/certs/server.key"
min_version = "1.2"
max_version = "1.3"
alpn_protocols = ["h2", "http/1.1"]
require_client_cert = false

[logging]
level = "info"
json_format = false

[waf]
enabled = true
fail_mode = "closed"

[waf.rate_limit]
per_ip_enabled = true
per_ip_max_requests = 100
per_ip_window_secs = 60
global_enabled = true
global_max_requests = 1000
global_window_secs = 60

[waf.security_events]
enabled = true
min_threat_level = "medium"
enable_cef = false
enable_otel = false

[waf.content_inspection]
enabled = true
inspect_headers = true
inspect_body = true
max_body_size = 1048576
threat_patterns = ["sql_injection", "xss", "command_injection", "path_traversal"]

[waf.geo_blocking]
enabled = false
blocked_countries = []
blocked_regions = []
block_tor = false
block_vpn = false
block_datacenter = false

[security.auth]
enabled = false
api_keys = []
header_name = "X-API-Key"
require_https = false
