# End-to-End Test Configuration for WAF-Rejected
# Optimized for testing with echo backend service

bind_addr = "127.0.0.1:8080"
upstream_uri = "http://127.0.0.1:3000"

[server]
max_connections = 10000
request_timeout_secs = 30
keep_alive_timeout_secs = 90
enable_http2 = true
max_body_size = 10485760  # 10MB

[logging]
level = "info"
json_format = false

[waf]
enabled = true

[waf.rate_limit]
per_ip_enabled = true
per_ip_max_requests = 5000
per_ip_window_secs = 60
global_enabled = true
global_max_requests = 50000
global_window_secs = 60

[waf.security_events]
enabled = true
format = "json"
min_threat_level = "medium"
enable_cef = false
enable_otel = false
enable_sled = false

[waf.content_inspection]
enabled = true
inspect_headers = true
inspect_body = true
max_body_size = 1048576  # 1MB
threat_patterns = ["sql_injection", "xss", "command_injection", "path_traversal"]

[waf.geo_blocking]
enabled = true
blocked_countries = ["XX", "ZZ"]  # Use fake country codes for testing
blocked_regions = []
block_tor = false
block_vpn = false
block_datacenter = false

[security]
# Nested configuration following the Config struct

[security.events]
enabled = true
format = "json"
min_threat_level = "medium"
enable_cef = false
enable_otel = false
enable_sled = false

[security.content_inspection]
enabled = true
inspect_headers = true
inspect_body = true
max_body_size = 1048576
threat_patterns = ["sql_injection", "xss", "command_injection", "path_traversal"]

[security.geo_blocking]
enabled = true
blocked_countries = ["XX", "ZZ"]
blocked_regions = []
block_tor = false
block_vpn = false
block_datacenter = false
