# Coraza WAF Configuration for WAF-Rejected
# ModSecurity-compatible rules for WASM execution

# Basic security rules
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# Request body limits
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 131072

# Argument limits
SecArgumentsLimit 1000
SecArgumentNameLength 400
SecArgumentValueLength 64000

# Basic SQL Injection Detection (Rule 950001)
SecRule ARGS "@detectSQLi" \
    "id:950001,\
    phase:2,\
    block,\
    msg:'SQL Injection Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-sqli',\
    ver:'OWASP_CRS/3.3.0',\
    severity:'CRITICAL'"

# Basic XSS Detection (Rule 941100)
SecRule ARGS "@detectXSS" \
    "id:941100,\
    phase:2,\
    block,\
    msg:'XSS Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-xss',\
    ver:'OWASP_CRS/3.3.0',\
    severity:'CRITICAL'"

# Path Traversal Detection (Rule 930100)
SecRule ARGS "@contains ../" \
    "id:930100,\
    phase:2,\
    block,\
    msg:'Path Traversal Attack (/../)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    ver:'OWASP_CRS/3.3.0',\
    severity:'CRITICAL'"

# Request Size Monitoring (Rule 200001)
SecRule REQUEST_BODY "@gt 102400" \
    "id:200001,\
    phase:2,\
    pass,\
    msg:'Large request body detected',\
    logdata:'Request body size: %{REQUEST_BODY_LENGTH} bytes',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-generic',\
    ver:'OWASP_CRS/3.3.0',\
    severity:'NOTICE'"
