[package]
name = "waf-ingress"
version = "0.1.0-beta.11"
edition = "2021"
authors = ["WAF Team"]
description = "High-Performance Rust-Based WAF Ingress"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/waf-ingress"

[[bin]]
name = "waf-ingress"
path = "src/main.rs"

[[bin]]
name = "waf-events-query"
path = "src/bin/waf-events-query.rs"
required-features = ["export-sled"]

[[bin]]
name = "create_sample_db"
path = "src/bin/create_sample_db.rs"
required-features = ["export-sled"]

[[bin]]
name = "storage_adapter_test"
path = "src/bin/storage_adapter_test.rs"

[[bin]]
name = "io_performance_test"
path = "src/bin/io_performance_test.rs"

[[bin]]
name = "network_io_performance_test" 
path = "src/bin/network_io_performance_test.rs"

[[bin]]
name = "grpc-allowlist"
path = "src/bin/grpc-allowlist.rs"

[dependencies]
# Async runtime and HTTP
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "1.0", features = ["full", "server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# WebSocket support
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

# Tower middleware stack
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "add-extension"] }

# TLS support
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
webpki-roots = "1"

# HTTP connector for clients
hyper-rustls = { version = "0.27", features = ["http1", "http2"] }

# HTTP/3 (QUIC) support, enabled with the `http3` feature
# NOTE: quinn 0.11.18 does not exist on crates.io; 0.11.12 is the latest
# release and requires quinn-proto ^0.11.18. The proto crate is pinned to
# 0.11.18 in Cargo.lock.
quinn = { version = "0.11.12", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

# WebTransport (WebTransport over HTTP/3), enabled with the `webtransport`
# feature. Uses the ring crypto provider and quinn re-export so the ALPN and
# rustls provider match the HTTP/3 listener.
wtransport = { version = "0.7.2", optional = true, default-features = false, features = ["ring", "quinn"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.14"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP utilities
http = "1.0"
bytes = "1.0"
# uuid moved to additional dependencies section

# Async utilities
futures = "0.3"
pin-project = "1.0"
parking_lot = "0.12"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# ModSecurity WASM Go integration

# WebAssembly runtime for the experimental reactor ABI. Only pulled in by the
# non-default `wasm-reactor` feature. `p1` provides the WASI preview1 imports
# used by the Go/Coraza reactor; `wat` keeps the in-tree WAT spike loadable.
wasmtime = { version = "49.0", optional = true, default-features = false, features = ["std", "runtime", "cranelift", "wat", "parallel-compilation", "async", "component-model"] }
wasmtime-wasi = { version = "49.0", optional = true, default-features = false, features = ["p1"] }

# Bounded request-body decompression (gzip/deflate via flate2, brotli via brotli)
flate2 = "1.1"
brotli = "7.0"

# Streaming body processing
async-stream = "0.3"

# Enhanced JSON handling for WASM calls
serde_bytes = "0.11"

# File watching for rule reloading  
# notify = "6.0" # Moved to additional dependencies section

# Redis client for rate limiting

# Additional dependencies for new features
regex = "1.10"
memchr = "2.7"
once_cell = "1.19"
uuid = { version = "1.6", features = ["v4", "serde"] }
notify = "6.1"
urlencoding = "2.1"
async-trait = "0.1"

# Development-only dependencies

# WebSocket handshake dependencies
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# OpenTelemetry dependencies for security event export (simplified)
opentelemetry = { version = "0.20", optional = true }
opentelemetry_sdk = { version = "0.20", optional = true }

# Embedded database for persistence before K/V integration
sled = { version = "0.34", optional = true }

# High-performance embedded database (Phase 2)
redb = { version = "3.0", optional = true }

# CLI utilities
clap = { version = "4.0", features = ["derive"] }

# Random number generation for testing
rand = "0.8"

# System information
num_cpus = "1.0"

# Memory mapping for optimized WASM loading

# Security modules dependencies
ipnetwork = "0.20"
maxminddb = "0.27"

# Threat intelligence integration
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
# Testing framework
proptest = "1"
testcontainers = "0.15"
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
# Self-signed certificate generation for TLS WebSocket upstream tests
rcgen = "0.14"
# WebTransport client used by the feature-gated integration tests. The
# dangerous-configuration feature enables the self-signed test client only.
wtransport = { version = "0.7.2", default-features = false, features = ["ring", "quinn", "dangerous-configuration"] }

[features]
default = ["export-system", "websocket", "wasm-reactor"]
integration-tests = []
wasm-waf = []
# Request-in/decision-out WASM reactor ABI (wasmtime host) that runs the
# real Coraza/CRS module before the built-in heuristic rules. Enabled by
# default; `--no-default-features` or `waf.coraza.enabled = false` opts out.
# See docs/coraza-wasi-reactor.md.
wasm-reactor = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Protocol support features
websocket = []
# HTTP/3 over QUIC. Not part of default features: it pulls in quinn/h3 and
# requires TLS 1.3 with certificates configured.
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]
# WebTransport over HTTP/3 on a dedicated UDP listener. Not part of default
# features: it requires TLS 1.3 with certificates configured.
webtransport = ["dep:wtransport"]
# Security features
geoip = []
# Export system features
export-system = ["sled", "opentelemetry", "opentelemetry_sdk"]
export-otel = ["opentelemetry", "opentelemetry_sdk"]
export-sled = ["sled"]
export-redb = ["redb"]
# Reserved; io_uring backend is a stub in Beta.
io-uring = []
# AI/ML threat detection features (heuristic implementation, no heavy ML deps)
ai-threat-detection = []
# Compliance features
compliance = ["sled"]

# Security modules performance benchmarks
[[bench]]
name = "security_performance"
harness = false

# Coraza WASI reactor benchmarks; only built with the non-default feature.
#   cargo bench --features wasm-reactor --bench coraza
[[bench]]
name = "coraza"
harness = false
required-features = ["wasm-reactor"]

# wasmtime compiles to native code once per module; optimising it in debug
# builds keeps `cargo test --features wasm-reactor` responsive without
# affecting the rest of the development profile.
[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[[bin]]
name = "enterprise_performance_test"
