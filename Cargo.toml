[package]
name = "waf-ingress"
version = "0.1.0"
edition = "2021"
authors = ["WAF Team"]
description = "High-Performance Rust-Based WAF Ingress"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/waf-ingress"

[[bin]]
name = "waf-ingress"
path = "src/main.rs"

[[bin]]
name = "waf-events-query"
path = "src/bin/waf-events-query.rs"
required-features = ["export-sled"]

[[bin]]
name = "create_sample_db"
path = "src/bin/create_sample_db.rs"
required-features = ["export-sled"]

[[bin]]
name = "storage_adapter_test"
path = "src/bin/storage_adapter_test.rs"

[[bin]]
name = "io_performance_test"
path = "src/bin/io_performance_test.rs"

[[bin]]
name = "network_io_performance_test" 
path = "src/bin/network_io_performance_test.rs"

[dependencies]
# Async runtime and HTTP
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "1.0", features = ["full", "server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# HTTP/3 and QUIC support
h3 = { version = "0.0.5", optional = true }
h3-quinn = { version = "0.0.5", optional = true }
quinn = { version = "0.11", optional = true }
rustls-native-certs = { version = "0.7", optional = true }

# WebSocket and WebTransport support
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

# WebTransport support (experimental)
web-transport = { git = "https://github.com/kixelated/web-transport-rs", optional = true }
web-transport-quinn = { git = "https://github.com/kixelated/web-transport-rs", optional = true }

# Tower middleware stack
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "add-extension"] }

# TLS support
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.0"

# HTTP connector for clients
hyper-rustls = { version = "0.27", features = ["http1", "http2"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.14"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP utilities
http = "1.0"
bytes = "1.0"
# uuid moved to additional dependencies section

# Async utilities
futures = "0.3"
pin-project = "1.0"
parking_lot = "0.12"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# ModSecurity WASM Go integration
wasmtime = { version = "26.0", features = ["component-model", "async", "pooling-allocator"], optional = true }
wasmtime-wasi = { version = "26.0", optional = true }
wasmtime-wasi-http = { version = "26.0", optional = true }

# Streaming body processing
async-stream = "0.3"

# Enhanced JSON handling for WASM calls
serde_bytes = "0.11"

# File watching for rule reloading  
# notify = "6.0" # Moved to additional dependencies section

# Redis client for rate limiting
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Additional dependencies for new features
regex = "1.10"
once_cell = "1.19"
uuid = { version = "1.6", features = ["v4", "serde"] }
notify = "6.1"
urlencoding = "2.1"
async-trait = "0.1"

# Development-only dependencies
rcgen = { version = "0.12", optional = true }

# WebSocket handshake dependencies
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# OpenTelemetry dependencies for security event export (simplified)
opentelemetry = { version = "0.20", optional = true }
opentelemetry_sdk = { version = "0.20", optional = true }

# Embedded database for persistence before K/V integration
sled = { version = "0.34", optional = true }

# High-performance embedded database (Phase 2)
redb = { version = "3.0", optional = true }

# High-performance I/O with io_uring (Linux only)
tokio-uring = { version = "0.5", optional = true }

# CLI utilities
clap = { version = "4.0", features = ["derive"] }

# Random number generation for testing
rand = "0.8"

# System information
num_cpus = "1.0"

# Memory mapping for optimized WASM loading
memmap2 = "0.9"

# Security modules dependencies
maxminddb = { version = "0.24", optional = true }
ipnetwork = "0.20"

# AI/ML dependencies for threat detection
candle-core = { version = "0.7", optional = true }
candle-nn = { version = "0.7", optional = true }
candle-transformers = { version = "0.7", optional = true }

# Data processing for ML
polars = { version = "0.41", features = ["lazy"], optional = true }
arrow = { version = "53.0", optional = true }

# Time series analysis
smartcore = { version = "0.3", optional = true }

# Statistics and ML utilities  
ndarray = { version = "0.15", optional = true }
rand_distr = { version = "0.4", optional = true }

# Threat intelligence integration
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# New dependencies for WebTransport binaries
url = { version = "2.5" }
rustls-pki-types = { version = "1.7" }

[dev-dependencies]
# Testing framework
testcontainers = "0.15"
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[features]
default = ["wasm-waf", "export-system", "http3", "websocket"]
integration-tests = []
wasm-waf = ["wasmtime", "wasmtime-wasi", "wasmtime-wasi-http"]
# Protocol support features
http3 = ["h3", "h3-quinn", "quinn", "rustls-native-certs"]
websocket = []
webtransport = ["web-transport", "web-transport-quinn", "rcgen"]
# Security features
geoip = ["maxminddb"]
# Export system features
export-system = ["sled", "opentelemetry", "opentelemetry_sdk"]
export-otel = ["opentelemetry", "opentelemetry_sdk"]
export-sled = ["sled"]
export-redb = ["redb"]
# I/O optimization features
io-uring = ["tokio-uring"]
# AI/ML threat detection features (simplified)
ai-threat-detection = ["polars", "smartcore", "ndarray", "rand_distr"]
# Compliance features
compliance = ["sled"]

# Security modules performance benchmarks
[[bench]]
name = "security_performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[[bin]]
name = "enterprise_performance_test"
path = "src/bin/enterprise_performance_test.rs"

[[bin]]
name = "enterprise_security_test"
path = "src/bin/enterprise_security_test.rs"

[[bin]]
name = "enterprise_compliance_test"
path = "src/bin/enterprise_compliance_test.rs"

[[bin]]
name = "enterprise_availability_test"  
path = "src/bin/enterprise_availability_test.rs"

[[bin]]
name = "enterprise_modsecurity_test"
path = "src/bin/enterprise_modsecurity_test.rs"

[[bin]]
name = "progressive_load_test"
path = "src/bin/progressive_load_test.rs"

[[bin]]
name = "echo_backend"
path = "src/bin/echo_backend.rs"

[[bin]]
name = "end_to_end_test"
path = "src/bin/end_to_end_test.rs"

[[bin]]
name = "advanced_test_backend"
path = "src/bin/advanced_test_backend.rs"

[[bin]]
name = "comprehensive_waf_test"
path = "src/bin/comprehensive_waf_test.rs"

[[bin]]
name = "simple_multi_protocol_test"
path = "src/bin/simple_multi_protocol_test.rs"

[[bin]]
name = "phase4_comprehensive_test"
path = "src/bin/phase4_comprehensive_test.rs"

[[bin]]
name = "phase4_standalone_test"
path = "src/bin/phase4_standalone_test.rs"

[[bin]]
name = "test_wasm_integration"
path = "src/bin/test_wasm_integration.rs"
required-features = ["wasm-waf"]

[[bin]]
name = "benchmark_core"
path = "src/bin/benchmark_core.rs"

[[bin]]
name = "websocket_performance_test"
path = "src/bin/websocket_performance_test.rs"

# New WebTransport E2E components (guarded by feature)
[[bin]]
name = "webtransport_waf_proxy"
path = "src/bin/webtransport_waf_proxy.rs"
required-features = ["webtransport"]

[[bin]]
name = "webtransport_echo_backend"
path = "src/bin/webtransport_echo_backend.rs"
required-features = ["webtransport"]

[[bin]]
name = "webtransport_performance_test"
path = "src/bin/webtransport_performance_test.rs"
required-features = ["webtransport"]