[package]
name = "waf-ingress"
version = "0.1.0"
edition = "2021"
authors = ["WAF Team"]
description = "High-Performance Rust-Based WAF Ingress"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/waf-ingress"

[[bin]]
name = "waf-ingress"
path = "src/main.rs"

[[bin]]
name = "waf-events-query"
path = "src/bin/waf-events-query.rs"
required-features = ["export-sled"]

[[bin]]
name = "create_sample_db"
path = "src/bin/create_sample_db.rs"
required-features = ["export-sled"]

[dependencies]
# Async runtime and HTTP
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "1.0", features = ["full", "server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# Tower middleware stack
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "add-extension"] }

# TLS support
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.0"

# HTTP connector for clients
hyper-rustls = { version = "0.27", features = ["http1", "http2"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.14"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP utilities
http = "1.0"
bytes = "1.0"
# uuid moved to additional dependencies section

# Async utilities
futures = "0.3"
pin-project = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# ModSecurity WASM Go integration
wasmtime = { version = "26.0", features = ["component-model", "async", "pooling-allocator"], optional = true }
wasmtime-wasi = { version = "26.0", optional = true }
wasmtime-wasi-http = { version = "26.0", optional = true }

# Streaming body processing
futures-util = "0.3"
async-stream = "0.3"

# Enhanced JSON handling for WASM calls
serde_bytes = "0.11"

# File watching for rule reloading  
# notify = "6.0" # Moved to additional dependencies section

# Redis client for rate limiting
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Additional dependencies for new features
regex = "1.10"
once_cell = "1.19"
uuid = { version = "1.6", features = ["v4", "serde"] }
notify = "6.1"
urlencoding = "2.1"
async-trait = "0.1"

# OpenTelemetry dependencies for security event export (simplified)
opentelemetry = { version = "0.20", optional = true }
opentelemetry_sdk = { version = "0.20", optional = true }

# Embedded database for persistence before K/V integration
sled = { version = "0.34", optional = true }

# CLI utilities
clap = { version = "4.0", features = ["derive"] }

# Security modules dependencies
maxminddb = { version = "0.24", optional = true }
ipnetwork = "0.20"

[dev-dependencies]
# Testing framework
testcontainers = "0.15"
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[features]
default = ["wasm-waf", "export-system"]
integration-tests = []
wasm-waf = ["wasmtime", "wasmtime-wasi", "wasmtime-wasi-http"]
# Security features
geoip = ["maxminddb"]
# Export system features
export-system = ["sled", "opentelemetry", "opentelemetry_sdk"]
export-otel = ["opentelemetry", "opentelemetry_sdk"]
export-sled = ["sled"]

# Security modules performance benchmarks
[[bench]]
name = "security_performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[[bin]]
name = "enterprise_performance_test"
path = "src/bin/enterprise_performance_test.rs"

[[bin]]
name = "enterprise_security_test"
path = "src/bin/enterprise_security_test.rs"

[[bin]]
name = "enterprise_compliance_test"
path = "src/bin/enterprise_compliance_test.rs"

[[bin]]
name = "enterprise_availability_test"  
path = "src/bin/enterprise_availability_test.rs"
