[[bin]]
name = "crs-prefilter-extract"
path = "src/bin/crs_prefilter_extract.rs"
required-features = ["crs-prefilter"]

# Prefilter latency / hit-rate / detection-parity harness. The sidecar half
# needs `coraza-native` in addition to `crs-prefilter`.
[[bin]]
name = "crs-prefilter-bench"
path = "src/bin/crs_prefilter_bench.rs"
required-features = ["crs-prefilter"]

# Native engine kernel prototype benchmark (p50/p95/p99, MB/s, alloc/request).
[[bin]]
name = "engine-kernel-bench"
path = "src/bin/engine_kernel_bench.rs"
required-features = ["engine-kernel"]

# Native engine kernel soundness harness over the pinned CRS corpus.
[[bin]]
name = "engine-kernel-corpus"
path = "src/bin/engine_kernel_corpus.rs"
required-features = ["engine-kernel"]

# Engine-level benchmark for the performance regression gate. Measures the
# Coraza WASI reactor, the native Rust CRS engine and the experimental kernel
# behind the same request set. See benchmarks/perf-gate/ and
# docs/design/perf-gate.md.
[[bin]]
name = "perf-gate-bench"
path = "src/bin/perf_gate_bench.rs"
required-features = ["wasm-reactor", "rust-engine", "engine-kernel"]


# Transform-pipeline latency and allocation harness (p50/p99, allocs/request).
[[bin]]
name = "transform-bench"
path = "src/bin/transform_bench.rs"
required-features = ["crs-prefilter"]
