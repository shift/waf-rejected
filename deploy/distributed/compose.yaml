# Local distributed WAF + distri-kv regional cell.
#
#   ./scripts/gen-distri-certs.sh
#   DISTRI_KV_IMAGE=distri-kv:9079588 docker compose -f deploy/distributed/compose.yaml up -d
#   ./scripts/demo-distributed.sh          # automated smoke + teardown
#
# Three distri-kv nodes form the regional cell (Raft peer transport on
# gRPC port + 1000); two WAF nodes run the `distri-kv` feature with
# `fallback = "local_only"`. Every published port is bound to 127.0.0.1 and
# every volume is project-scoped, so the stack can run beside a development
# WAF without sharing storage.
#
# The distri-kv image is not published by this repository. Build it from a
# distri-kv checkout with deploy/distributed/Dockerfile.distri-kv and set
# DISTRI_KV_IMAGE, or point DISTRI_KV_IMAGE at an internal registry.
#
# The current WAF client does not attach bearer/mTLS metadata yet. The WAF
# nodes therefore stay in `local_only` and report `waf_distributed_connected 0`
# until a trusted auth-terminating sidecar is placed in front of the cluster;
# this is exactly the failure mode the fallback test exercises.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-dkv-common: &dkv-common
  image: ${DISTRI_KV_IMAGE:-distri-kv:9079588}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging
  networks:
    - distri

x-waf-common: &waf-common
  image: ${WAF_IMAGE:-waf-rejected-distributed:local}
  build:
    context: ../..
    dockerfile: deploy/distributed/Dockerfile.waf
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging
  networks:
    - distri

services:
  upstream:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:3000", "-text=upstream-ok"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - distri

  dkv-1:
    <<: *dkv-common
    hostname: dkv-1
    command:
      - /usr/local/bin/distri-kv-server
      - --config
      - /etc/distri-kv/config.toml
      - --node-id
      - "1"
      - --peers
      - 1=dkv-1:8443,2=dkv-2:8443,3=dkv-3:8443
    ports:
      - "127.0.0.1:${DKV_GRPC_PORT:-17443}:7443"
    volumes:
      - dkv-data-1:/var/lib/distri-kv
      - ../../config/examples/distri-regional.toml:/etc/distri-kv/config.toml:ro
      - ./certs:/etc/distri-kv/certs:ro
      - ./secrets:/etc/distri-kv/secrets:ro
    networks:
      distri:
        aliases:
          - dkv-client
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  dkv-2:
    <<: *dkv-common
    hostname: dkv-2
    command:
      - /usr/local/bin/distri-kv-server
      - --config
      - /etc/distri-kv/config.toml
      - --node-id
      - "2"
      - --peers
      - 1=dkv-1:8443,2=dkv-2:8443,3=dkv-3:8443
    volumes:
      - dkv-data-2:/var/lib/distri-kv
      - ../../config/examples/distri-regional.toml:/etc/distri-kv/config.toml:ro
      - ./certs:/etc/distri-kv/certs:ro
      - ./secrets:/etc/distri-kv/secrets:ro
    networks:
      distri:
        aliases:
          - dkv-client
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  dkv-3:
    <<: *dkv-common
    hostname: dkv-3
    command:
      - /usr/local/bin/distri-kv-server
      - --config
      - /etc/distri-kv/config.toml
      - --node-id
      - "3"
      - --peers
      - 1=dkv-1:8443,2=dkv-2:8443,3=dkv-3:8443
    volumes:
      - dkv-data-3:/var/lib/distri-kv
      - ../../config/examples/distri-regional.toml:/etc/distri-kv/config.toml:ro
      - ./certs:/etc/distri-kv/certs:ro
      - ./secrets:/etc/distri-kv/secrets:ro
    networks:
      distri:
        aliases:
          - dkv-client
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  waf-1:
    <<: *waf-common
    hostname: waf-1
    volumes:
      - waf-data-1:/var/lib/waf
      - ../../config/examples/distributed-waf.toml:/etc/waf/config.toml:ro
    environment:
      WAF_CONFIG_FILE: /etc/waf/config.toml
      RUST_LOG: info
      WAF_UPSTREAM_URI: http://upstream:3000
      WAF_PROXY__UPSTREAM_URL: http://upstream:3000
      WAF_WAF__DISTRIBUTED__NODE_ID: waf-1
    ports:
      - "127.0.0.1:${WAF1_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${WAF1_ADMIN_PORT:-18081}:8081"
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s

  waf-2:
    <<: *waf-common
    hostname: waf-2
    volumes:
      - waf-data-2:/var/lib/waf
      - ../../config/examples/distributed-waf.toml:/etc/waf/config.toml:ro
    environment:
      WAF_CONFIG_FILE: /etc/waf/config.toml
      RUST_LOG: info
      WAF_UPSTREAM_URI: http://upstream:3000
      WAF_PROXY__UPSTREAM_URL: http://upstream:3000
      WAF_WAF__DISTRIBUTED__NODE_ID: waf-2
    ports:
      - "127.0.0.1:${WAF2_HTTP_PORT:-18082}:8080"
      - "127.0.0.1:${WAF2_ADMIN_PORT:-18083}:8081"
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s

networks:
  # Compose prefixes this with the project name, so parallel demo runs are
  # isolated without an explicit network name.
  distri:

volumes:
  dkv-data-1:
  dkv-data-2:
  dkv-data-3:
  waf-data-1:
  waf-data-2:
