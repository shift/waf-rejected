# distri-kv regional cell: 3-node StatefulSet with stable peer DNS.
#
# Replace the image and the Secret placeholders before applying. The
# distri-kv image must contain /bin/sh and curl because node identity and the
# local-only monitoring endpoints are handled inside the container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: distri-regional-config
  namespace: waf-distributed
  labels:
    app.kubernetes.io/name: distri-kv
data:
  config.toml: |
    [server]
    bind_address = "0.0.0.0:7443"
    admin_address = "0.0.0.0:7444"
    data_dir = "/var/lib/distri-kv"
    log_level = "info"
    json_logging = true

    [cluster]
    node_id = 1
    initial_cluster_size = 3
    election_timeout_ms = 300
    heartbeat_interval_ms = 50
    max_log_entries_per_batch = 1000
    snapshot_threshold = 10000
    enable_pre_vote = true
    jurisdictions = ["eu"]

    [storage]
    backend = "Sled"
    sync_writes = true
    compression = "Lz4"
    max_db_size_gb = 100
    auto_compaction = true
    compaction_schedule = "0 2 * * *"

    [multi_raft]
    initial_partitions = 16
    replication_factor = 3
    split_threshold_ops_per_sec = 10000
    merge_threshold_keys = 1000
    virtual_nodes_per_partition = 100
    auto_rebalancing = true
    rebalancing_interval_sec = 60

    [network]
    max_message_size_mb = 16
    connection_timeout_ms = 5000
    keep_alive_interval_ms = 30000
    concurrent_streams = 1000
    enable_compression = false
    tcp_nodelay = true
    connection_pool_size = 32

    [monitoring]
    metrics_enabled = true
    metrics_port = 9091
    health_check_port = 8082
    profiling_enabled = false
    metrics_interval_sec = 15
    enable_tracing = true
    trace_sampling_rate = 0.1

    [security]
    # Local/demo bearer path. For SPIFFE/mTLS set tls_enabled and mutual_tls
    # and present the x-spiffe-id metadata. See docs/operations/distributed-deployment.md.
    tls_enabled = false
    cert_file = "/etc/distri-kv/certs/server.crt"
    key_file = "/etc/distri-kv/certs/server.key"
    ca_file = "/etc/distri-kv/certs/ca.crt"
    mutual_tls = false
    auth_enabled = true
    auth_provider = "ApiKey"
    api_key_file = "/etc/distri-kv/secrets/waf-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: distri-waf-auth
  namespace: waf-distributed
  labels:
    app.kubernetes.io/name: distri-kv
type: Opaque
stringData:
  # Placeholder. Generate with ./scripts/gen-distri-certs.sh and replace, or
  # create with: kubectl create secret generic distri-waf-auth \
  #   --from-file=waf-token=deploy/distributed/secrets/waf-token \
  #   -n waf-distributed --dry-run=client -o yaml
  waf-token: REPLACE_WITH_GENERATED_BEARER_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: distri-waf-tls
  namespace: waf-distributed
  labels:
    app.kubernetes.io/name: distri-kv
type: Opaque
stringData:
  # Placeholders for the optional mTLS/SPIFFE path. Replace the base64 values
  # or use kubectl create secret tls/generic with the generated files.
  ca.crt: REPLACE_WITH_CA_CERTIFICATE
  server.crt: REPLACE_WITH_SERVER_CERTIFICATE
  server.key: REPLACE_WITH_SERVER_PRIVATE_KEY
  client.crt: REPLACE_WITH_CLIENT_CERTIFICATE
  client.key: REPLACE_WITH_CLIENT_PRIVATE_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: dkv-headless
  namespace: waf-distributed
  labels:
    app.kubernetes.io/name: distri-kv
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: distri-kv
  ports:
    - name: grpc
      port: 7443
      targetPort: grpc
    - name: raft
      port: 8443
      targetPort: raft
---
apiVersion: v1
kind: Service
metadata:
  name: dkv-client
  namespace: waf-distributed
  labels:
    app.kubernetes.io/name: distri-kv
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: distri-kv
  ports:
    - name: grpc
      port: 7443
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distri-kv
  namespace: waf-distributed
  labels:
    app.kubernetes.io/name: distri-kv
    app.kubernetes.io/component: control-plane
spec:
  serviceName: dkv-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: distri-kv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distri-kv
        app.kubernetes.io/component: control-plane
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: distri-kv
              topologyKey: kubernetes.io/hostname
      containers:
        - name: distri-kv
          image: ghcr.io/shift/distri-kv:9079588
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              exec /usr/local/bin/distri-kv-server \
                --config /etc/distri-kv/config.toml \
                --node-id "$((ordinal + 1))" \
                --peers "1=dkv-0.dkv-headless:8443,2=dkv-1.dkv-headless:8443,3=dkv-2.dkv-headless:8443"
          ports:
            - name: grpc
              containerPort: 7443
            - name: admin
              containerPort: 7444
            - name: health
              containerPort: 8082
            - name: raft
              containerPort: 8443
            - name: metrics
              containerPort: 9091
          env:
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: config
              mountPath: /etc/distri-kv/config.toml
              subPath: config.toml
              readOnly: true
            - name: auth
              mountPath: /etc/distri-kv/secrets
              readOnly: true
            - name: tls
              mountPath: /etc/distri-kv/certs
              readOnly: true
            - name: data
              mountPath: /var/lib/distri-kv
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "http://127.0.0.1:8082/health"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "http://127.0.0.1:8082/health"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: distri-regional-config
        - name: auth
          secret:
            secretName: distri-waf-auth
        - name: tls
          secret:
            secretName: distri-waf-tls
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
