# WAF-Rejected high-throughput profile: native Coraza sidecar.
#
#   docker compose -f deploy/compose/native-performance.yaml up --build
#
# The proxy and sidecar share a Unix socket volume. Both run as uid/gid 1000
# because the socket is mode 0660; filesystem access is the only authentication
# on that boundary. The sidecar filesystem is read-only, the CRS rules are
# mounted read-only, and all capabilities are dropped.
#
# This profile is opt-in. The default `config.toml` still selects the wasm
# backend. See docs/operations/native-performance-profile.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The named volume is created root-owned. Create the socket directory with
  # the runtime uid before either workload starts.
  coraza-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - mkdir -p /run/waf && chown 1000:1000 /run/waf && chmod 0750 /run/waf
    volumes:
      - coraza-run:/run/waf
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # mkdir is done as root; chown needs CAP_CHOWN and nothing else.
    cap_add:
      - CHOWN

  coraza-sidecar:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile.coraza-sidecar
    user: "1000:1000"
    command:
      - --socket
      - /run/waf/coraza.sock
      - --rules
      - /usr/share/waf/coraza/crs/crs.conf
      - --max-body
      - "65536"
      - --max-headers
      - "100"
      - --max-header-bytes
      - "65536"
      - --max-conns
      - "128"
      - --timeout
      - 5s
      - --grace
      - 10s
    volumes:
      - coraza-run:/run/waf
      # Read-only rules. The image also bakes the same CRS bundle at this path;
      # the mount makes the intended immutability explicit.
      - ../../wasm/coraza_reactor/rules/crs:/usr/share/waf/coraza/crs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Distroless image: use the sidecar's own probe mode instead of a shell.
      test:
        - CMD
        - /usr/local/bin/coraza-sidecar
        - --probe
        - --socket
        - /run/waf/coraza.sock
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s
    depends_on:
      coraza-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 1g
        reservations:
          cpus: "1.0"
          memory: 256m
    restart: unless-stopped
    logging: *default-logging

  waf-proxy:
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "1000:1000"
    volumes:
      - coraza-run:/run/waf:ro
      - ../../config/performance-native.toml:/etc/waf/config.toml:ro
    environment:
      RUST_LOG: info
      WAF_CONFIG_FILE: /etc/waf/config.toml
    ports:
      - "8080:8080"
      - "8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/waf:size=64m,mode=0750,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    depends_on:
      coraza-sidecar:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 128m
    restart: unless-stopped
    logging: *default-logging

  upstream:
    image: hashicorp/http-echo:1.0
    command: ["-listen=:3000", "-text=upstream-ok"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  coraza-run:
