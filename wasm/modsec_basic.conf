# Basic ModSecurity Configuration for WAF-Rejected
# This configuration provides essential security rules for web application protection

# Engine Configuration
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 134217728
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyInMemoryLimit 131072
SecResponseBodyLimit 524288
SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000

# Audit Log Configuration
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABDEFHIJZ
SecAuditLogType Serial

# File Upload Configuration
SecTmpDir /tmp/
SecDataDir /tmp/

# Debug Log
SecDebugLog /tmp/modsec_debug.log
SecDebugLogLevel 3

# Basic Attack Detection Rules

# SQL Injection Detection
SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/* \
    "(?i:(?:[\s'\"`´'']+(?:[\d\W]++|(?:(?:delete|insert|update|select|union|create|drop|grant|revoke|alter|execute|exec|truncate)\s))))" \
    "id:1001,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'SQL Injection Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-sqli',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    tag:'capec/1000/152/248/66',\
    tag:'PCI/6.5.2',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.sql_injection_score=+1'"

# XSS Detection
SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/* \
    "(?i:<[/!]?+(?:[a-z]++(?:[\s/]|(?:</?))*+)+(?:[^>]*+(?:on\w++|style|data-)|[^>])*+>?+)" \
    "id:1002,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'XSS Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-xss',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    tag:'capec/1000/152/242/63',\
    tag:'PCI/6.5.7',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.xss_score=+1'"

# Path Traversal Detection
SecRule REQUEST_FILENAME|ARGS_NAMES|ARGS \
    "(?i:(?:\.{2}[/\\\\]+)+)" \
    "id:1003,\
    phase:2,\
    block,\
    capture,\
    t:urlDecodeUni,\
    t:htmlEntityDecode,\
    t:normalisePathWin,\
    msg:'Path Traversal Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-lfi',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    tag:'capec/1000/255/153/126',\
    tag:'PCI/6.5.4',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.lfi_score=+1'"

# Command Injection Detection
SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/* \
    "(?i:(?:[\s;|`]+(?:[\d\W]*+(?:(?:cat|ls|dir|type|copy|del|rm|mv|cp|chmod|chown|find|grep|ps|kill|whoami|id|uname|env|set|get|curl|wget|nc|netcat|telnet|ssh|ftp|tftp|ping|nslookup|dig|host|arp|route|ifconfig|ipconfig)\s))))" \
    "id:1004,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Command Injection Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-injection-generic',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    tag:'capec/1000/152/248/88',\
    tag:'PCI/6.5.1',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.rce_score=+1'"

# HTTP Method Restriction
SecRule REQUEST_METHOD "!@pm GET HEAD POST PUT DELETE OPTIONS PATCH" \
    "id:1005,\
    phase:1,\
    block,\
    msg:'Invalid HTTP Method',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-protocol',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'ERROR'"

# User-Agent Validation
SecRule REQUEST_HEADERS:User-Agent "@detectSQLi" \
    "id:1006,\
    phase:1,\
    block,\
    msg:'SQL Injection in User-Agent Header',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-sqli',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'CRITICAL'"

# Content-Type Validation for POST requests
SecRule REQUEST_METHOD "@streq POST" \
    "id:1007,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "!@beginsWith application/" \
        "block,\
        msg:'Missing or Invalid Content-Type for POST request',\
        tag:'application-multi',\
        tag:'language-multi',\
        tag:'platform-multi',\
        tag:'attack-protocol',\
        tag:'paranoia-level/1',\
        tag:'OWASP_CRS',\
        ver:'OWASP_CRS/4.0.0',\
        severity:'WARNING'"

# Rate Limiting (Basic)
SecAction "id:1008,\
    phase:1,\
    pass,\
    nolog,\
    initcol:ip=%{REMOTE_ADDR},\
    setvar:ip.requests=+1,\
    expirevar:ip.requests=60"

SecRule IP:REQUESTS "@gt 100" \
    "id:1009,\
    phase:1,\
    block,\
    msg:'Rate Limit Exceeded: Too many requests from IP',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-dos',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'WARNING'"

# Anomaly Scoring
SecAction "id:1010,\
    phase:2,\
    pass,\
    nolog,\
    setvar:tx.critical_anomaly_score=5,\
    setvar:tx.error_anomaly_score=4,\
    setvar:tx.warning_anomaly_score=3,\
    setvar:tx.notice_anomaly_score=2,\
    setvar:tx.inbound_anomaly_score_threshold=5"

# Block based on anomaly score
SecRule TX:INBOUND_ANOMALY_SCORE_PL1 "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:1011,\
    phase:2,\
    block,\
    msg:'Inbound Anomaly Score Exceeded (Total Score: %{TX.INBOUND_ANOMALY_SCORE_PL1})',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-generic',\
    ver:'OWASP_CRS/4.0.0',\
    severity:'CRITICAL'"
