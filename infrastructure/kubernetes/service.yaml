apiVersion: v1
kind: Service
metadata:
  name: waf-rejected
  namespace: security
  labels:
    app: waf-rejected
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: waf-rejected
---
apiVersion: v1
kind: Service
metadata:
  name: waf-rejected-internal
  namespace: security
  labels:
    app: waf-rejected
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: waf-rejected