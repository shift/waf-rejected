apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-rejected-config
  namespace: security
data:
  production.toml: |
    bind_addr = "0.0.0.0:8080"
    health_bind_addr = "0.0.0.0:8081"
    upstream_uri = "http://backend-service:8080"

    [server]
    max_connections = 10000
    trusted_proxies = ["10.0.0.0/8"]
    request_timeout_secs = 30
    keep_alive_timeout_secs = 90
    enable_http2 = true
    enable_http3 = false
    supported_http_versions = ["1.0", "1.1", "2"]
    max_body_size = 10485760

    [server.tls]
    enabled = false

    [logging]
    level = "info"
    json_format = true

    [waf]
    enabled = true
    fail_mode = "closed"
    upstream_timeout_ms = 30000

    [waf.rate_limit]
    per_ip_enabled = true
    per_ip_max_requests = 100
    per_ip_window_secs = 60
    global_enabled = true
    global_max_requests = 10000
    global_window_secs = 60

    [waf.security_events]
    enabled = true
    format = "json"
    min_threat_level = "medium"
    enable_cef = true
    cef_output_file = "/var/log/waf/security_events.cef"
    cef_device_vendor = "WAF-Rejected"
    cef_device_product = "WAF-Rejected"
    cef_device_version = "0.1.0"
    enable_otel = true
    otel_service_name = "waf-rejected"
    otel_service_version = "0.1.0"
    otel_export_traces = true
    otel_export_logs = true
    enable_sled = true
    sled_db_path = "/var/log/waf/security.db"
    sled_max_events = 1000000
    sled_compress = true

    [waf.content_inspection]
    enabled = true
    inspect_headers = true
    inspect_body = true
    max_body_size = 10485760
    threat_patterns = ["sql_injection", "xss", "command_injection", "path_traversal"]

    [waf.geo_blocking]
    enabled = false
    blocked_countries = []
    blocked_regions = []
    block_tor = false
    block_vpn = false
    block_datacenter = false

    [waf.wasm]
    enabled = false

    [security.auth]
    enabled = false
    api_keys = []
    header_name = "X-API-Key"
    require_https = true

    [security.ai]
    enabled = false

    [security.compliance]
    enabled = true

    [security.compliance.regulatory]
    gdpr = true
    ai_act = true
    nis2 = true
    cra = true
