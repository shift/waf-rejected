groups:
  - name: waf-rejected-alerts
    rules:
      - alert: HighBlockRate
        expr: rate(waf_blocked_total[5m]) > 10
        for: 2m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "High rate of WAF-blocked requests"
          description: "WAF-Rejected is blocking {{ $value }} requests per second"

      - alert: HighAuthFailureRate
        expr: rate(waf_auth_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Elevated authentication failures"
          description: "{{ $value | humanize }} requests per second are failing API-key authentication"

      - alert: HighRateLimitedRate
        expr: rate(waf_rate_limited_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Elevated rate limiting"
          description: "{{ $value | humanize }} requests per second are being rate limited"

      - alert: CorazaEvaluationErrorRate
        expr: |
          rate(waf_coraza_errors_total[5m])
          /
          clamp_min(rate(waf_coraza_evaluations_total[5m]), 0.001)
          > 0.05
        for: 2m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Coraza reactor evaluation errors"
          description: "{{ $value | humanizePercentage }} of Coraza evaluations are failing"

      - alert: CorazaBlockSpike
        expr: rate(waf_coraza_blocks_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Coraza block spike"
          description: "Coraza is blocking {{ $value | humanize }} requests per second"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(waf_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High WAF request latency"
          description: "95th percentile request duration is {{ $value }}s"

      - alert: UpstreamErrorRate
        expr: |
          rate(waf_upstream_errors_total[5m])
          /
          clamp_min(rate(waf_requests_total[5m]), 0.001)
          > 0.05
        for: 2m
        labels:
          severity: warning
          category: reliability
        annotations:
          summary: "High upstream error rate"
          description: "{{ $value | humanizePercentage }} of requests are failing upstream"

      - alert: NoTraffic
        expr: rate(waf_requests_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
          category: reliability
        annotations:
          summary: "WAF-Rejected is receiving no traffic"
          description: "No requests observed for 10 minutes"

      - alert: PodRestarting
        expr: rate(kube_pod_container_status_restarts_total{namespace="security", pod=~"waf-rejected-.*"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "WAF-Rejected pod restarting"
          description: "Pod {{ $labels.pod }} is restarting"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{namespace="security", pod=~"waf-rejected-.*"} / container_spec_memory_limit_bytes > 0.8
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High memory usage"
          description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{namespace="security", pod=~"waf-rejected-.*"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High CPU usage"
          description: "Pod {{ $labels.pod }} CPU usage is high"

      - alert: CorazaAdmissionHeavyRejections
        expr: |
          rate(waf_admission_rejected_total[5m])
          /
          clamp_min(rate(waf_coraza_evaluations_total[5m]), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Sustained heavy-inspection admission rejections"
          description: "{{ $value | humanizePercentage }} of Coraza evaluations are being rejected by admission control; heavy bodies are saturating the pool"
          runbook_url: "https://github.com/waf-rejected/waf-rejected/blob/main/docs/operations/runbook.md#corazaadmissionheavyrejections"

      - alert: CorazaAdmissionQueueSaturated
        expr: waf_admission_queue_depth > 0
        for: 2m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Heavy-inspection admission queue saturated"
          description: "{{ $value }} heavy inspections have been waiting for a permit for 2 minutes; heavy bodies are saturating the pool"
          runbook_url: "https://github.com/waf-rejected/waf-rejected/blob/main/docs/operations/runbook.md#corazaadmissionqueuesaturated"

      - alert: CorazaBodyTruncationSpike
        expr: rate(waf_coraza_body_truncated_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Coraza body-policy truncation spike"
          description: "{{ $value | humanize }} bodies per second are being truncated to max_inspect_bytes; the configured inspection prefix may be too small for production traffic"
          runbook_url: "https://github.com/waf-rejected/waf-rejected/blob/main/docs/operations/runbook.md#corazabodytruncationspike"

      - alert: CorazaBodyRejectionSpike
        expr: rate(waf_coraza_body_rejected_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Coraza body-policy rejection spike"
          description: "{{ $value | humanize }} bodies per second are being rejected with 413 by the oversize policy; clients may be sending bodies above max_inspect_bytes"
          runbook_url: "https://github.com/waf-rejected/waf-rejected/blob/main/docs/operations/runbook.md#corazabodyrejectionspike"

      - alert: CorazaEvaluationDurationSLOBurn
        expr: histogram_quantile(0.99, sum by (le) (rate(waf_coraza_evaluation_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Coraza evaluation-duration SLO burn"
          description: "Coraza p99 evaluation duration is {{ $value }}s, above the 0.5s SLO; heavy bodies or reactor contention are eroding the latency budget"
          runbook_url: "https://github.com/waf-rejected/waf-rejected/blob/main/docs/operations/runbook.md#corazaevaluationdurationsloburn"

      - alert: GrpcBlockRateAnomaly
        expr: |
          sum(rate(waf_grpc_decisions_total{decision="block"}[5m]))
          /
          clamp_min(sum(rate(waf_grpc_decisions_total[5m])), 0.001)
          > 0.2
          and
          sum(rate(waf_grpc_decisions_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "gRPC block-rate anomaly"
          description: "{{ $value | humanizePercentage }} of gRPC protocol decisions are blocks; check the allowlist, descriptor limits and recent rule changes"
          runbook_url: "https://github.com/waf-rejected/waf-rejected/blob/main/docs/operations/runbook.md#grpcblockrateanomaly"

      - alert: GraphqlBlockRateAnomaly
        expr: |
          sum(rate(waf_graphql_decisions_total{decision="block"}[5m]))
          /
          clamp_min(sum(rate(waf_graphql_decisions_total[5m])), 0.001)
          > 0.2
          and
          sum(rate(waf_graphql_decisions_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "GraphQL block-rate anomaly"
          description: "{{ $value | humanizePercentage }} of GraphQL protocol decisions are blocks; check the operation allowlist, depth/alias limits and recent rule changes"
          runbook_url: "https://github.com/waf-rejected/waf-rejected/blob/main/docs/operations/runbook.md#graphqlblockrateanomaly"

      - alert: ReactorPoolExhaustion
        expr: |
          sum(waf_admission_queue_depth) > 0
          and
          sum(waf_admission_inflight{class="heavy"}) > 0
        for: 5m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Reactor pool exhaustion"
          description: "Heavy inspections are queued while heavy in-flight work is non-zero for 5 minutes; the reactor pool is exhausted. Direct pool/worker gauges are not exported, so admission queue depth is the pool-pressure signal."
          runbook_url: "https://github.com/waf-rejected/waf-rejected/blob/main/docs/operations/runbook.md#reactorpoolexhaustion"
