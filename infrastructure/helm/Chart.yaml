apiVersion: v2
name: waf-rejected
description: Enterprise Web Application Firewall with AI threat detection
type: application
version: 0.1.0
appVersion: "0.1.0"

keywords:
  - waf
  - security
  - firewall
  - ai
  - threat-detection

maintainers:
  - name: WAF-Rejected Team
    email: security@waf-rejected.com

dependencies:
  - name: prometheus
    version: "15.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "6.50.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled