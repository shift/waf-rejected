name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Export image tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker save "${IMAGE}" | gzip -9 > "waf-rejected-${VERSION}-image.tar.gz"
          test -s "waf-rejected-${VERSION}-image.tar.gz"
          ls -l "waf-rejected-${VERSION}-image.tar.gz"
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: waf-rejected-*-image.tar.gz
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --all \
            --override-filename "waf-rejected-${VERSION}"
          test -s "waf-rejected-${VERSION}.cdx.json"
          ls -l "waf-rejected-${VERSION}.cdx.json"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: waf-rejected-*.cdx.json
          if-no-files-found: error

  build-release:
    needs:
      - sbom
      - build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: image
          path: image
      - name: Install Nix
        uses: cachix/install-nix-action@v25
      - name: Build release binary
        run: nix build .#waf-ingress
      - name: Package artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist "waf-rejected-v${VERSION}"
          cp result/bin/waf-ingress "waf-rejected-v${VERSION}/"
          cp README.md CHANGELOG.md SECURITY.md LICENSE-* "waf-rejected-v${VERSION}/"
          cp "sbom/waf-rejected-${VERSION}.cdx.json" "waf-rejected-v${VERSION}/"
          cp -r rules "waf-rejected-v${VERSION}/"
          tar -czf "dist/waf-rejected-v${VERSION}-x86_64-linux.tar.gz" "waf-rejected-v${VERSION}"
          cp "image/waf-rejected-${VERSION}-image.tar.gz" dist/
          cp "sbom/waf-rejected-${VERSION}.cdx.json" dist/
          cd dist
          for asset in \
            "waf-rejected-v${VERSION}-x86_64-linux.tar.gz" \
            "waf-rejected-${VERSION}-image.tar.gz" \
            "waf-rejected-${VERSION}.cdx.json"; do
            test -s "${asset}"
            sha256sum "${asset}" > "${asset}.sha256"
          done
          sha256sum --check ./*.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/waf-rejected-v*-x86_64-linux.tar.gz
            dist/waf-rejected-*-image.tar.gz
            dist/waf-rejected-*.cdx.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/waf-rejected-v*-x86_64-linux.tar.gz
            dist/waf-rejected-*-image.tar.gz
            dist/waf-rejected-*.cdx.json
            dist/*.sha256
