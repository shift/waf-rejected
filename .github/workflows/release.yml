name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v25
      - name: Build release binary
        run: nix build .#waf-ingress
      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "waf-rejected-v${VERSION}"
          cp result/bin/waf-ingress "waf-rejected-v${VERSION}/"
          cp README.md CHANGELOG.md LICENSE-* "waf-rejected-v${VERSION}/"
          cp -r rules "waf-rejected-v${VERSION}/"
          tar -czf "waf-rejected-v${VERSION}-x86_64-linux.tar.gz" "waf-rejected-v${VERSION}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: waf-rejected-*-x86_64-linux.tar.gz
