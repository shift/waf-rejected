# High-throughput profile: fast-allow, allow cache, admission control and
# upstream-pool tuning.
#
# SECURITY NOTES — read before copying this file:
#   * `waf.fast_allow` is an explicit inspection exclusion for the listed
#     routes. Only bodyless, query-free requests match; method, size,
#     rate-limit and geographic gates still run. Never list a route that can
#     carry user input.
#   * `waf.allow_cache` memoises only pure-content `Allow` verdicts for a short
#     TTL. Blocks are never cached and stateful/IP-dependent rules still run.
#     It requires a build with the non-default `allow-cache` feature.
#   * `waf.admission` does not weaken inspection: heavy requests either get a
#     permit or fail closed with 503 + Retry-After.
#   * `proxy.streaming` relays large upstream responses; the byte cap and
#     deadline still apply.
#
# These are tuning starting points, not universal defaults. Measure on your
# own hardware and keep `fail_mode = "closed"`.
#
# Run:
#   WAF_CONFIG_FILE=config/examples/high-throughput.toml waf-ingress

bind_addr = "0.0.0.0:8080"
health_bind_addr = "0.0.0.0:8081"
upstream_uri = "http://127.0.0.1:3000"

[proxy]
upstream_url = "http://127.0.0.1:3000"
bind_addr = "0.0.0.0:8080"
timeout_seconds = 30
max_request_size = 10485760
[proxy.pool]
enabled = true
max_idle_per_host = 64
idle_timeout_secs = 90
# 0 disables health probes; set e.g. 10 with a real path when enabled.
health_check_interval_secs = 0
health_check_path = "/healthz"

[proxy.streaming]
enabled = true
# Responses advertising at least this content-length are relayed frame by frame.
response_threshold_bytes = 1048576

[server]
max_connections = 10000
request_timeout_secs = 30
keep_alive_timeout_secs = 90
enable_http2 = true
enable_http3 = false
supported_http_versions = ["1.0", "1.1", "2"]
max_body_size = 10485760
# HTTP/3 admission (only used when enable_http3 = true and the binary is built
# with the `http3` feature). Bounds concurrent handlers before body reads.
h3_max_inflight_requests = 256
h3_max_inflight_per_client = 0
h3_admission_timeout_ms = 250
grpc_max_stream_bytes = 4194304
grpc_max_stream_seconds = 300
grpc_aware_rejections = true
io_backend = "tokio"

[server.websocket]
# Parser limits enforced before a message is assembled. 0 inherits
# server.max_body_size. max_frame_bytes must not exceed max_message_bytes.
max_frame_bytes = 0
max_message_bytes = 0

[server.http2]
enabled = true
initial_stream_window_bytes = 1048576
initial_connection_window_bytes = 16777216
max_concurrent_streams = 256
max_pending_accept_reset_streams = 1024
keep_alive_interval_secs = 30
keep_alive_timeout_secs = 10
keep_alive_while_idle = false
adaptive_window = false

[logging]
level = "info"
json_format = true

[waf]
enabled = true
fail_mode = "closed"
upstream_timeout_ms = 30000

[waf.coraza]
backend = "rust"
fallback = "none"
max_payload_bytes = 65536
max_inspect_bytes = 65536
oversize_action = "reject"
eval_timeout_ms = 5000

[waf.admission]
enabled = true
# 0 = auto (about half the reactor pool, reserving workers for cheap traffic).
heavy_permits = 0
queue_timeout_ms = 250
max_queued = 64

[waf.fast_allow]
enabled = true
# Exact "METHOD /path" matches. These routes must be safe for unauthenticated,
# bodyless, query-free traffic. Prefer immutable static assets.
routes = ["GET /assets/app.css", "GET /favicon.ico"]
allow_audit_sample_rate = 0.0

[waf.allow_cache]
# Requires a build with the non-default `allow-cache` feature.
enabled = true
ttl_secs = 30
max_entries = 8192
max_body_bytes = 65536
# Empty = every route; prefix matches on a '/' boundary.
routes = ["/api"]

[waf.rate_limit]
per_ip_enabled = true
per_ip_max_requests = 6000
per_ip_window_secs = 60
global_enabled = true
global_max_requests = 100000
global_window_secs = 60

[waf.content_inspection]
enabled = true
inspect_headers = true
inspect_body = true
max_body_size = 10485760
threat_patterns = ["sql_injection", "xss", "command_injection", "path_traversal"]

[waf.security_events]
enabled = true
format = "json"
min_threat_level = "medium"
enable_cef = false
enable_otel = false
# Keep the hot path allocation-light; enable sled only when a durable local
# audit trail is required.
enable_sled = false

[runtime]
# Leave worker_threads unset to use Tokio's default (logical CPUs).
# worker_threads = 8
# max_blocking_threads = 512
# CPU pinning requires the non-default `cpu-pinning` build feature; when the
# feature or platform is unavailable the proxy logs a warning and stays unpinned.
enable_cpu_pinning = false
# cpu_pin_cores = [0, 1, 2, 3]

[storage]
backend = "redb"
path = "./data/waf.redb"
enable_follower_reads = true
ttl_cleanup_interval = { secs = 60, nanos = 0 }
enable_compression = false
cache_size = 16777216
