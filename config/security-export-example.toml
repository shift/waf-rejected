# WAF configuration with security event exporters.
#
# This example shows how to configure OpenTelemetry and CEF export for security
# events. Migrated from the historical schema (server.host/port/workers,
# proxy.upstream_host, top-level [rate_limit], logging.format) to the current
# loader schema.

bind_addr = "0.0.0.0:8080"
health_bind_addr = "0.0.0.0:8081"
upstream_uri = "http://127.0.0.1:3000"

[server]
max_connections = 10000
max_body_size = 10485760

[proxy]
upstream_url = "http://127.0.0.1:3000"
bind_addr = "0.0.0.0:8080"
timeout_seconds = 30
max_request_size = 10485760

[waf]
enabled = true

# Security Events Configuration with Export Capabilities
[waf.security_events]
enabled = true
format = "json"
min_threat_level = "medium"

# Common Event Format (CEF) Exporter for SIEM Integration
enable_cef = true
cef_output_file = "/var/log/waf/security-events.cef"
cef_device_vendor = "WAF-Rejected"
cef_device_product = "Security WAF"
cef_device_version = "1.0.0"

# OpenTelemetry Exporter for Observability Platforms
enable_otel = true
otel_service_name = "waf-security-events"
otel_service_version = "1.0.0"
otel_export_traces = true
otel_export_logs = true

# Persistent audit-trail store. redb is the default backend; select the legacy
# sled store with `store_backend = "sled"` (requires the reverse-migration
# runbook before downgrading a redb store).
store_backend = "redb"
store_path = "./data/waf_security_events.redb"
store_max_events = 100000  # Keep last 100K events, cleanup older ones
enable_sled = false        # Legacy sled backend (opt-in)
# sled_db_path = "./data/waf_security_events.sled"
# sled_max_events = 100000
sled_compress = false      # Legacy sled compression flag

[waf.content_inspection]
enabled = true
inspect_headers = true
inspect_body = true
max_body_size = 1048576  # 1MB
threat_patterns = [
    # SQL Injection Patterns
    "(?i)(union|select|insert|update|delete|drop|create|alter|exec|declare)\\s+",
    "(?i)'\\s*(or|and)\\s+'.*=.*",
    "(?i)\\b(@@version|information_schema|sysobjects)\\b",

    # XSS Patterns
    "(?i)<script[^>]*>.*</script>",
    "(?i)javascript\\s*:",
    "(?i)on(load|error|click|mouseover)\\s*=",

    # Command Injection
    "(?i)\\b(system|exec|shell_exec|passthru|eval)\\s*\\(",
    "(?i)[;&|`]\\s*(ls|cat|pwd|whoami|id|uname|ps|netstat)\\b",

    # Path Traversal
    "(?i)\\.\\.\\/",
    "(?i)\\.\\.\\\\",
    "(?i)%2e%2e%2f",

    # LFI/RFI Patterns
    "(?i)(file|php|data|http|ftp|jar)\\s*:",
    "(?i)\\b(etc\\/passwd|boot\\.ini|web\\.config)\\b",
]

[waf.geo_blocking]
enabled = true
blocked_countries = ["CN", "RU", "KP"]
blocked_regions = []
block_tor = true
block_vpn = false
block_datacenter = true

[waf.rate_limit]
per_ip_enabled = true
per_ip_max_requests = 100
per_ip_window_secs = 60
global_enabled = true
global_max_requests = 1000
global_window_secs = 60

[logging]
level = "info"
json_format = true

# OpenTelemetry Configuration
# Set these environment variables to configure OTel endpoints:
# OTEL_EXPORTER_OTLP_ENDPOINT=http://your-otel-collector:4317
# OTEL_EXPORTER_OTLP_HEADERS=x-api-key=your-api-key
# OTEL_SERVICE_NAME=waf-rejected
# OTEL_SERVICE_VERSION=1.0.0

# Example: Export to Jaeger
# OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:14268/api/traces

# Example: Export to Elastic APM
# OTEL_EXPORTER_OTLP_ENDPOINT=https://your-elastic-apm.elastic.co:443
# OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer your-secret-token

# Example: Export to Honeycomb
# OTEL_EXPORTER_OTLP_ENDPOINT=https://api.honeycomb.io
# OTEL_EXPORTER_OTLP_HEADERS=x-honeycomb-team=your-api-key
